function nbaPicUrl(id){
  return "https://cdn.nba.com/headshots/nba/latest/1040x760/"+id+".png";
}
function supaStorageUrl(filename){
  return SUPA_URL+"/storage/v1/object/public/players/"+filename;
}

let logEl, uploaded=0, errors=0, previewData=[];

function log(m,c){
  const d=document.createElement("div");
  if(c)d.className=c;
  d.textContent="["+new Date().toLocaleTimeString("fr")+"] "+m;
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
}
function setBar(p){document.getElementById("bar").style.width=p+"%";}

async function fetchAndUpload(nbaId, filename){
  const imgUrl=nbaPicUrl(nbaId);
  const imgResp=await fetch(imgUrl);
  if(!imgResp.ok) throw new Error("NBA CDN "+imgResp.status);
  const blob=await imgResp.blob();
  const uploadResp=await fetch(SUPA_URL+"/storage/v1/object/players/"+filename,{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+SUPA_KEY,
      "Content-Type":blob.type||"image/png",
      "x-upsert":"true",
    },
    body:blob,
  });
  if(!uploadResp.ok){
    const t=await uploadResp.text();
    throw new Error(t.slice(0,80));
  }
  return supaStorageUrl(filename);
}

async function updatePlayerDB(name, photoUrl){
  await fetch(SUPA_URL+"/rest/v1/players?name=eq."+encodeURIComponent(name.toLowerCase().trim()),{
    method:"PATCH",
    headers:{
      "apikey":SUPA_KEY,
      "Authorization":"Bearer "+SUPA_KEY,
      "Content-Type":"application/json",
    },
    body:JSON.stringify({photo_url:photoUrl,avatar_url:photoUrl}),
  });
}

async function startUpload(){
  const btn=document.getElementById("btn");
  btn.disabled=true;
  logEl=document.getElementById("log");
  logEl.innerHTML="";
  uploaded=0;errors=0;previewData=[];
  ["sUploaded","sErrors"].forEach(id=>document.getElementById(id).textContent="0");
  document.getElementById("status").textContent="";
  document.getElementById("preview").innerHTML="";

  log("Démarrage upload "+NBA_PLAYERS.length+" joueurs...","info");

  const BATCH=5;
  for(let i=0;i<NBA_PLAYERS.length;i+=BATCH){
    const batch=NBA_PLAYERS.slice(i,i+BATCH);
    setBar(Math.round(i/NBA_PLAYERS.length*100));
    await Promise.all(batch.map(async p=>{
      const filename="nba_"+p.id+".png";
      try{
        const supaUrl=await fetchAndUpload(p.id,filename);
        await updatePlayerDB(p.name,supaUrl);
        uploaded++;
        document.getElementById("sUploaded").textContent=uploaded;
        previewData.push({name:p.name,url:supaUrl});
        if(uploaded%25===0) log(uploaded+" photos uploadées...","ok");
      }catch(e){
        errors++;
        document.getElementById("sErrors").textContent=errors;
        if(errors<=5) log("✗ "+p.name+": "+e.message,"err");
      }
    }));
    await new Promise(r=>setTimeout(r,150));
  }

  setBar(100);
  const statusEl=document.getElementById("status");
  if(errors<20){
    statusEl.textContent="✅ "+uploaded+" photos HD dans Supabase !";
    statusEl.style.cssText="background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.3);padding:10px;border-radius:8px;margin-top:10px;text-align:center;font-weight:700;";
    log("✅ TERMINÉ : "+uploaded+" uploadées, "+errors+" erreurs","ok");
  }else{
    statusEl.textContent="⚠️ "+uploaded+" OK, "+errors+" erreurs";
    statusEl.style.color="#fbbf24";
  }

  // Aperçu
  const area=document.getElementById("preview");
  area.innerHTML="";
  document.getElementById("pc").textContent=Math.min(previewData.length,40)+" affichés";
  previewData.slice(0,40).forEach(p=>{
    const d=document.createElement("div");
    d.className="pc";
    d.innerHTML='<img class="ph" src="'+p.url+'" alt="'+p.name+'" onerror="this.src=''"/><div class="pn">'+p.name.split(" ").pop()+"</div>";
    area.appendChild(d);
  });

  btn.disabled=false;
}
</script></body></html>
